<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdfbf7"/>
      <stop offset="50%" stop-color="#f5ede2"/>
      <stop offset="100%" stop-color="#ebe0d0"/>
    </linearGradient>

    <!-- Wood Texture Gradient for USB -->
    <linearGradient id="woodGrad" x1="0%" y1="0%" x2="100%" y2="20%">
      <stop offset="0%" stop-color="#c28e5c"/>
      <stop offset="30%" stop-color="#dfad7a"/>
      <stop offset="60%" stop-color="#b57f4d"/>
      <stop offset="100%" stop-color="#966336"/>
    </linearGradient>

    <!-- Wood Cap Gradient -->
    <linearGradient id="woodCapGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a67140"/>
      <stop offset="50%" stop-color="#cb9866"/>
      <stop offset="100%" stop-color="#8c5828"/>
    </linearGradient>

    <!-- Metallic USB Connector -->
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="30%" stop-color="#cbd5e1"/>
      <stop offset="70%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>

    <!-- Box Kraft Gradient -->
    <linearGradient id="kraftGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eedfc8"/>
      <stop offset="100%" stop-color="#d4bf9c"/>
    </linearGradient>

    <!-- Soft Shadow Filter -->
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#4a3b2c" flood-opacity="0.18"/>
    </filter>

    <filter id="usbShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="4" dy="14" stdDeviation="12" flood-color="#2c1e12" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Canvas Surface / Tabletop -->
  <rect width="800" height="600" fill="url(#bgGrad)"/>

  <!-- Subtle Studio Ambient Glow -->
  <circle cx="400" cy="300" r="280" fill="#ea580c" opacity="0.04" filter="blur(60px)"/>

  <!-- DELIVERY PRESENTATION GIFT BOX -->
  <g filter="url(#dropShadow)">
    <!-- Box Base -->
    <rect x="180" y="140" width="440" height="320" rx="24" fill="url(#kraftGrad)" stroke="#c8b088" stroke-width="2"/>
    
    <!-- Box Inner Recess / Soft Foam Velvet Bed -->
    <rect x="204" y="164" width="392" height="272" rx="16" fill="#292524"/>
    
    <!-- Subtle Foam Texture Lines -->
    <rect x="210" y="170" width="380" height="260" rx="12" fill="#1c1917" opacity="0.6"/>

    <!-- Tape Ribbon Deco in Box -->
    <path d="M 204 220 L 596 220" stroke="#ea580c" stroke-width="6" opacity="0.85"/>
    <circle cx="400" cy="220" r="14" fill="#ea580c"/>
    <circle cx="400" cy="220" r="6" fill="#ffffff"/>
  </g>

  <!-- LUXURY ENGRAVED WOODEN USB FLASH DRIVE -->
  <g filter="url(#usbShadow)">
    <!-- Metal Connector -->
    <rect x="365" y="240" width="70" height="55" rx="4" fill="url(#metalGrad)" stroke="#475569" stroke-width="1.5"/>
    
    <!-- USB Inside Holes -->
    <rect x="378" y="252" width="16" height="12" rx="2" fill="#334155"/>
    <rect x="406" y="252" width="16" height="12" rx="2" fill="#334155"/>

    <!-- USB Wooden Main Body -->
    <rect x="330" y="285" width="140" height="115" rx="12" fill="url(#woodGrad)" stroke="#7c4a1e" stroke-width="1.5"/>

    <!-- Wood Grain Subtle Lines -->
    <path d="M 340 310 Q 400 305 460 312" stroke="#8c5828" stroke-width="1" fill="none" opacity="0.4"/>
    <path d="M 335 345 Q 395 350 465 342" stroke="#8c5828" stroke-width="1" fill="none" opacity="0.4"/>
    <path d="M 342 375 Q 410 380 458 372" stroke="#8c5828" stroke-width="1" fill="none" opacity="0.3"/>

    <!-- Engraved Brand Logo on USB -->
    <text x="400" y="340" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="bold" fill="#451a03" text-anchor="middle" letter-spacing="1">
      DigiMemories
    </text>
    
    <text x="400" y="360" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="600" fill="#78350f" text-anchor="middle" letter-spacing="2">
      64GB • MP4 1080p
    </text>

    <!-- USB Wooden Magnetic Cap Beside -->
    <g transform="translate(110, 20)">
      <rect x="400" y="270" width="48" height="110" rx="10" fill="url(#woodCapGrad)" stroke="#7c4a1e" stroke-width="1.5"/>
      <rect x="394" y="295" width="8" height="60" rx="2" fill="#334155" opacity="0.7"/>
    </g>
  </g>

  <!-- HIGHLIGHT BADGES & TAGS -->
  <!-- MP4 High Fidelity Tag -->
  <g transform="translate(130, 430)">
    <rect width="180" height="42" rx="21" fill="#ffffff" stroke="#e7dfd5" stroke-width="1.5" filter="url(#usbShadow)"/>
    <circle cx="24" cy="21" r="10" fill="#ea580c"/>
    <path d="M 21 16 L 29 21 L 21 26 Z" fill="#ffffff"/>
    <text x="46" y="26" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="bold" fill="#1c1917">
      Archivos MP4 Listos
    </text>
  </g>

  <!-- Original Tapes Returned Safe Tag -->
  <g transform="translate(480, 430)">
    <rect width="210" height="42" rx="21" fill="#ffffff" stroke="#e7dfd5" stroke-width="1.5" filter="url(#usbShadow)"/>
    <circle cx="24" cy="21" r="10" fill="#16a34a"/>
    <path d="M 19 21 L 23 25 L 29 17" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <text x="46" y="26" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="bold" fill="#1c1917">
      Cintas Originales Intactas
    </text>
  </g>

  <!-- Top Title Banner -->
  <text x="400" y="90" font-family="'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="800" fill="#ea580c" text-anchor="middle" letter-spacing="1">
    ENTREGA FÍSICA EN MEMORIA USB &amp; DEVOLUCIÓN DE CINTAS
  </text>
</svg>
